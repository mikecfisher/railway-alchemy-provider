name: Feature request
description: Propose a Railway resource or provider capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Railway workflow cannot currently be expressed?
    validations:
      required: true
  - type: textarea
    id: resource
    attributes:
      label: Railway resource and API
      description: Identify the Railway object and documented API operations.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and deletion semantics
      description: Explain what adoption and stack destruction should do.
    validations:
      required: true
  - type: textarea
    id: drift
    attributes:
      label: Observable drift
      description: Explain how the provider can read and compare live state.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
